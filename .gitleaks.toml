# opencode-estate house rule (SPEC C3): NO secret-shaped material — real, test,
# or synthetic — in any tree or git history, ever.
#   - Real credentials come from AWS SSM Parameter Store / Secrets Manager at runtime.
#   - Test crypto material and dummy tokens are generated at runtime, never stored.
# This gate config is enforced on every scan of this repository.

[extend]
useDefault = true

# House rule: flag any PEM private-key block in code or history.
[[rules]]
id = "pem-private-key-block"
description = "PEM Private Key Block"
title = "PEM Private Key Block"
tags = ["key", "pem", "private"]
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''
