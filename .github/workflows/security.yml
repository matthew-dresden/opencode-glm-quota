name: security

# Additive secret-scanning gate: mirrors the local gitleaks hooks.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download gitleaks 8.30.1 and checksums
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks_8.30.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o gitleaks_8.30.1_checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt

      - name: Verify checksum (sha256)
        shell: bash
        run: |
          set -euo pipefail
          grep 'gitleaks_8.30.1_linux_x64.tar.gz' gitleaks_8.30.1_checksums.txt | sha256sum -c -

      - name: Extract gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Gitleaks detect (full history, redacted)
        shell: bash
        run: |
          set -euo pipefail
          ./gitleaks detect --config .gitleaks.toml --redact --verbose
